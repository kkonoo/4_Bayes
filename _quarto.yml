project:
  type: website
  execute-dir: project
  render:
    - "*.qmd"           # .qmd만 렌더 (CHAPTER_SPEC.md 같은 작성 메모는 사이트에 올리지 않음)

website:
  title: "베이지안 통계"
  description: "생명정보학을 위한 베이지안 통계 — 이론과 R 실습"
  favicon: images/logo.ico
  navbar:
    left:
      - href: index.qmd
        text: Home
    right:
      - icon: github
        href: https://github.com/kkonoo/4_Bayes

  sidebar:
    style: "floating"
    search: true
    contents:
      - text: "Home"
        href: index.qmd
      - section: "Part 1. 베이지안 통계의 기초"
        contents:
          - chapters/01_probability_bayes.qmd
          - chapters/02_conjugate.qmd
          - chapters/03_prior_posterior.qmd
          - chapters/04_approximation.qmd
          - chapters/05_mcmc_basics.qmd
          - chapters/06_hmc_diagnostics.qmd
          - chapters/07_hierarchical_modelcomp.qmd
      - section: "Part 2. 생명정보학 응용"
        contents:
          - chapters/08_bayesian_regression.qmd
          - chapters/09_finemapping.qmd
          - chapters/10_colocalization.qmd
          - chapters/11_hmm_chromatin.qmd
          - chapters/12_cnv_calling.qmd
          - chapters/13_capstone.qmd

  page-footer:
    left: "Copyright 2026, Eunji"

format:
  html:
    theme:
      light: cosmo
    css: assets/html.css
    toc: true
    toc-depth: 4
    toc-title: "Contents"
    toc-float: true
    page-layout: full

    code-fold: false
    code-copy: true
    highlight-style: github

    number-sections: false
    smooth-scroll: true

    # AI 채팅 위젯 전역 설정
    include-after-body: assets/ai-chat-init.html

  revealjs:
    css: assets/revealjs.css

execute:
  freeze: auto          # 코드 실행 결과 캐시 (빠른 빌드)
  echo: true
  eval: true            # base R 코드는 실제 실행해 결과를 보여줍니다
  warning: false
  message: false

knitr:
  opts_chunk:
    dev: "png"
    dev.args:
      type: "cairo"
    fig.width: 8
    fig.height: 4.5
    dpi: 150
